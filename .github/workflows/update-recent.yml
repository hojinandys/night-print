name: Observe and renew recent NASA comparison

on:
  workflow_dispatch:
  schedule:
    # Weekly metadata check; only completed NASA monthly composites can be built.
    - cron: '37 3 * * 2'

# Share the publication lock with the independent annual workflow.
concurrency:
  group: night-print-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.ready.outputs.publish }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install metadata and publication checks
        run: python -m pip install 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Discover completed NASA observations
        run: python pipeline/nasa_observations.py --check
      - name: Compare the published monthly edition
        id: detect
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/build_recent.py plan --github-output "$GITHUB_OUTPUT"
      - name: Test monthly publication and incomplete 3D rejection
        run: python -m unittest discover -s tests -p test_build_recent.py -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test regional stories and recoverable observation loading
        run: node --test tests/*.mjs
      - name: Test observation archive and linked-map validation
        run: |
          python -m unittest discover -s tests -p test_edition_history.py -v
          python -m unittest discover -s tests -p test_export_experience.py -v
      - name: Retain the existing edition without download credentials
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available != 'true'
        run: python pipeline/build_recent.py record-status --state needs_credentials
      - name: Record an unchanged monthly observation check
        if: steps.detect.outputs.needs_build != 'true'
        run: python pipeline/build_recent.py record-status --state up_to_date
      - name: Restore verified source-file cache
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available == 'true'
        uses: actions/cache@v4
        with:
          path: .runtime/nasa/raw
          key: nasa-vj146a3-v002-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nasa-vj146a3-v002-${{ runner.os }}-
      - name: Install scientific tools
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available == 'true'
        run: python -m pip install -r requirements.txt
      - name: Test NASA source and quality validation
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available == 'true'
        run: python -m unittest discover -s tests -p test_nasa_observations.py -v
      - name: Acquire and validate the real monthly pair
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available == 'true'
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          python pipeline/nasa_observations.py --download
          python pipeline/build_recent.py plan
      - name: Install the pinned official Blender release
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available == 'true'
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.0.sha256 -o /tmp/blender.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib
          rows=Path('/tmp/blender.sha256').read_text().splitlines()
          expected=next(line.split()[0] for line in rows if line.strip().endswith('blender-4.4.0-linux-x64.tar.xz'))
          assert expected=='b4a74463677618d09621332ddbd62baa1a3ed06a11818714f6c5f1c7f31a15c6', 'Blender distribution identity changed'
          assert hashlib.sha256(Path('/tmp/blender.tar.xz').read_bytes()).hexdigest()==expected, 'Official archive checksum failed'
          PY
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build and safely replace only the recent edition
        if: steps.detect.outputs.needs_build == 'true' && steps.detect.outputs.credentials_available == 'true'
        run: python pipeline/build_recent.py build --blender /tmp/blender-4.4.0-linux-x64/blender --cpu
      - name: Validate both editions and 3D before preserving publication
        id: ready
        run: |
          python pipeline/update.py validate
          if [ ! -f dist/recent/data/manifest.json ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python pipeline/build_recent.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/recent
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified NASA monthly comparison'
            git push
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Upload complete validated Pages artifact
        if: steps.ready.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Preserve the public-source audit without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-monthly-audit-${{ github.run_id }}
          path: |
            .runtime/recent-updates.json
            .runtime/recent-plan.json
            .runtime/nasa/check.json
            .runtime/nasa/last_import.json
            .runtime/nasa/receipts/*.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish both complete observation editions
        id: deployment
        uses: actions/deploy-pages@v4
