name: Observe and renew Night Print

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 03:17 UTC / 12:17 Korea. The source is annual, not live telemetry.
    - cron: '17 3 * * 1'

concurrency:
  group: night-print-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      edition: ${{ steps.detect.outputs.needs_build }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install light checking tools
        run: python -m pip install 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Check official annual metadata
        id: detect
        run: python pipeline/update.py check --github-output "$GITHUB_OUTPUT"
      - name: Test publication, 3D completeness and failure recovery
        run: python -m unittest discover -s tests -p test_update.py -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test regional stories and recoverable observation loading
        run: node --test tests/*.mjs
      - name: Test observation archive and linked-map validation
        run: |
          python -m unittest discover -s tests -p test_edition_history.py -v
          python -m unittest discover -s tests -p test_export_experience.py -v
      - name: Restore national source cache
        if: steps.detect.outputs.needs_build == 'true'
        uses: actions/cache@v4
        with:
          path: .runtime/downloads
          key: worldpop-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: worldpop-v1-${{ runner.os }}-
      - name: Install scientific tools
        if: steps.detect.outputs.needs_build == 'true'
        run: python -m pip install -r requirements.txt
      - name: Install Blender 4.4 from its official distribution
        if: steps.detect.outputs.needs_build == 'true'
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.4/blender-4.4.0.sha256 -o /tmp/blender.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib
          rows=Path('/tmp/blender.sha256').read_text().splitlines()
          expected=next(line.split()[0] for line in rows if line.strip().endswith('blender-4.4.0-linux-x64.tar.xz'))
          assert expected=='b4a74463677618d09621332ddbd62baa1a3ed06a11818714f6c5f1c7f31a15c6', 'Blender distribution identity changed'
          actual=hashlib.sha256(Path('/tmp/blender.tar.xz').read_bytes()).hexdigest()
          assert actual==expected, 'Official Blender archive checksum failed'
          PY
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Rebuild art only for new observations
        if: steps.detect.outputs.needs_build == 'true'
        run: python pipeline/update.py build --blender /tmp/blender-4.4.0-linux-x64/blender --cpu
      - name: Record an unchanged observation check
        if: steps.detect.outputs.needs_build != 'true'
        run: python pipeline/update.py record-check
      - name: Validate both editions and interactive geometry
        run: python pipeline/update.py validate
      - name: Preserve the verified edition in Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Night Print observation edition'
            git push
          fi
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Preserve update audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-audit-${{ github.run_id }}
          path: |
            .runtime/updates.json
            .runtime/plan.json
            .runtime/provider_metadata.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish complete verified edition
        id: deployment
        uses: actions/deploy-pages@v4
